name = "illegal-dumping-map-cleanup"
main = "index.ts"
compatibility_date = "2024-09-23"

[triggers]
crons = ["0 3 * * *"]  # daily at 03:00 UTC

[[d1_databases]]
binding = "DB"
database_name = "illegal-dumping-map"
database_id = "local"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "illegal-dumping-map"
